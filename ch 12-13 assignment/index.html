<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH 12-13 Assignment</title>
</head>
<body>
    <h1>CH 12-13 Assignment</h1>

    <script>
        // Q1: Number, uppercase letter or lowercase letter
var ch = prompt("Enter a single character (number or letter):");
var code = ch.charCodeAt(0);

if (code >= 48 && code <= 57) {
  console.log(ch + " is a number");
} else if (code >= 65 && code <= 90) {
  console.log(ch + " is an uppercase letter");
} else if (code >= 97 && code <= 122) {
  console.log(ch + " is a lowercase letter");
} else {
  console.log(ch + " is a special character");
}

// Q2: Larger of two integers
var x = Number(prompt("Enter first integer:"));
var y = Number(prompt("Enter second integer:"));

if (x > y) {
  console.log(x + " is larger");
} else if (y > x) {
  console.log(y + " is larger");
} else {
  console.log("Both integers are equal");
}

// Q3: Positive, negative or zero
var num = Number(prompt("Enter a number:"));

if (num > 0) {
  console.log(num + " is positive");
} else if (num < 0) {
  console.log(num + " is negative");
} else {
  console.log("The number is zero");
}

// Q4: Vowel or not
var letter = prompt("Enter a single character:").toLowerCase();

if (letter === "a" || letter === "e" || letter === "i" || letter === "o" || letter === "u") {
  console.log(true);
} else {
  console.log(false);
}

// Q5: Password check
var correctPassword = "pakistan123";
var userPassword = prompt("Enter your password:");

if (userPassword === "" || userPassword === null) {
  console.log("Please enter your password");
} else if (userPassword === correctPassword) {
  console.log("Correct! The password you entered matches the original password");
} else {
  console.log("Incorrect password");
}

// Q6: Fixed if/else
var greeting;
var hour = 13;

if (hour < 18) {
  greeting = "Good day";
} else {
  greeting = "Good evening";
}
console.log(greeting);

// Q7: Time in 24 hour format
var time = Number(prompt("Enter time in 24 hour format (e.g. 1900):"));

if (time >= 0 && time < 1200) {
  console.log("Good morning!");
} else if (time >= 1200 && time < 1700) {
  console.log("Good afternoon!");
} else if (time >= 1700 && time < 2100) {
  console.log("Good evening!");
} else if (time >= 2100 && time <= 2359) {
  console.log("Good night!");
} else {
  console.log("Invalid time");
}
    </script>
</body>
</html>
